<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agenticwAIfu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">
  <div class="page-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Character Home</p>
        <h1><a class="home-link" href="index.html">agenticwAIfu</a></h1>
      </div>
    </header>

    <main class="workspace workspace-home">
      <aside class="panel left-panel">
        <section class="panel-section">
          <div class="section-heading">
            <h2>Chats</h2>
          </div>

          <div class="stack-list">
            <button class="list-card chat-card new-chat-card">
              <span class="new-chat-plus">+</span>
              <strong>New Chat</strong>
              <span class="chat-persona">Start a new conversation</span>
            </button>
            <button class="list-card chat-card">
              <span class="meta-line">Today | 18 messages</span>
              <strong>First contact in the velvet lounge</strong>
              <span class="chat-persona">Character 1</span>
            </button>
            <button class="list-card chat-card">
              <span class="meta-line">Yesterday | 43 messages</span>
              <strong>Planning the infiltration route</strong>
              <span class="chat-persona">Character 2</span>
            </button>
            <button class="list-card chat-card">
              <span class="meta-line">Draft | Unused</span>
              <strong>Untitled new conversation</strong>
              <span class="chat-persona">Character 3</span>
            </button>
          </div>
        </section>
      </aside>

      <section class="panel center-panel home-center-panel">
        <div class="center-stage">
          <div class="home-surface" id="default-surface">
            <div class="character-grid-header">
              <div>
                <h2 class="chat-title">Characters</h2>
              </div>
            </div>

            <div class="character-tile-grid" id="character-tile-grid"></div>
          </div>

          <section class="editor-overlay" id="character-editor" aria-hidden="true">
            <div class="overlay-header">
              <div>
                <p class="overlay-kicker">Character Manager</p>
              </div>
              <button class="overlay-close-button" type="button" data-close-editor>Close</button>
            </div>

            <div class="overlay-form">
              <div class="character-detail character-detail-single">
                <div class="character-detail-header">
                  <h3 class="character-detail-title" id="character-detail-title">Character 1</h3>
                  <div class="manager-button-row">
                    <button class="manager-button manager-button-primary" id="save-character-button" type="button">Save</button>
                  </div>
                </div>

                <p class="manager-status" id="character-file-status">Characters are loaded from and saved to a fixed folder on your PC.</p>

                <div class="character-editor-portrait-block">
                  <div class="character-editor-portrait-frame">
                    <img id="editor-character-portrait-preview" class="character-editor-portrait" src="assets/character-1.png" alt="Character portrait preview">
                  </div>

                  <div class="overlay-field overlay-field-compact">
                    <label class="overlay-label" for="editor-character-image-file">Portrait File</label>
                    <input id="editor-character-image-file" class="overlay-input" type="file" accept="image/*">
                  </div>
                </div>

                <div class="overlay-field">
                  <label class="overlay-label" for="editor-character-name">Character Name</label>
                  <input id="editor-character-name" class="overlay-input" type="text" value="Character 1">
                </div>

                <div class="overlay-field">
                  <label class="overlay-label" for="editor-character-nickname">Nickname</label>
                  <input id="editor-character-nickname" class="overlay-input" type="text" value="Character 1">
                </div>

                <div class="overlay-field">
                  <label class="overlay-label" for="editor-character-description">Description</label>
                  <textarea id="editor-character-description" class="overlay-textarea" rows="7">A poised host with a theatrical edge, tailored diction, and a tendency to turn ordinary requests into intimate little ceremonies.</textarea>
                </div>

                <div class="overlay-field">
                  <label class="overlay-label" for="editor-character-dialogue">Example Dialogue</label>
                  <textarea id="editor-character-dialogue" class="overlay-textarea" rows="8">"Welcome back. The room is prepared, and the city is glittering just for us tonight."

"Tell me what mood you want, and I will make the scene behave accordingly."

"If we are going to do this properly, you should start with a line worth remembering."</textarea>
                </div>

                <div class="character-editor-footer">
                  <button class="manager-button manager-button-danger" id="delete-character-button" type="button">Delete</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
